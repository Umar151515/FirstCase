[project]
name = "firstcase"
version = "0.1.0"
description = "FirstCase verified first experience marketplace"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.38,<2.1", "asyncpg>=0.30,<1",
  "alembic>=1.15,<2", "pydantic>=2.10,<3", "pydantic-settings>=2.8,<3",
  "pyjwt>=2.10,<3", "python-multipart>=0.0.20,<1", "aiogram>=3.18,<4",
  "httpx>=0.28,<1", "pillow>=11,<13"
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["frontend", ".venv", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["shared/tests"]
pythonpath = ["."]
