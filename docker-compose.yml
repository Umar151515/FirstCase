name: firstcase

x-app-env: &app-env
  APP_MODE: ${APP_MODE:-demo}
  DEBUG: ${DEBUG:-true}
  DATABASE_URL: postgresql+asyncpg://firstcase:${POSTGRES_PASSWORD:-firstcase_demo_local}@postgres:5432/firstcase_demo
  TEST_DATABASE_URL: postgresql+asyncpg://firstcase_test:${TEST_POSTGRES_PASSWORD:-firstcase_test_local}@test-postgres:5432/firstcase_test
  JWT_SECRET: ${JWT_SECRET:-firstcase-local-demo-secret-change-in-production-4d924ef7}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
  TELEGRAM_AUTH_MAX_AGE: ${TELEGRAM_AUTH_MAX_AGE:-3600}
  AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-30}
  WRITE_RATE_LIMIT: ${WRITE_RATE_LIMIT:-120}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
  PUBLIC_WEBAPP_URL: ${PUBLIC_WEBAPP_URL:-http://localhost:8080}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000}
  UPLOAD_DIR: /data/uploads
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}

services:
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_USER: firstcase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firstcase_demo_local}
      POSTGRES_DB: firstcase_demo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5543}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firstcase -d firstcase_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  test-postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    profiles: ["test"]
    environment:
      POSTGRES_USER: firstcase_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-firstcase_test_local}
      POSTGRES_DB: firstcase_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5544}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firstcase_test -d firstcase_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    environment: *app-env
    command: ["python", "-m", "scripts.run_backend", "--reload"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_BASE_URL: /api/v1
        APP_MODE: demo
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  bot:
    profiles: ["bot"]
    build:
      context: .
      dockerfile: bot/Dockerfile
    environment: *app-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    environment:
      <<: *app-env
      APP_MODE: demo
      UPLOAD_DIR: /tmp/firstcase-test-uploads
    command: ["pytest", "shared/tests", "-q"]
    depends_on:
      test-postgres:
        condition: service_healthy

volumes:
  postgres-data:
  uploads:
