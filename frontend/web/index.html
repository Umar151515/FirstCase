<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#174687">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FirstCase">
  <link rel="apple-touch-icon" href="icons/app-192.png">
  <link rel="icon" type="image/png" href="icons/favicon-light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="icons/favicon-dark.png" media="(prefers-color-scheme: dark)">
  <title>FirstCase</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #fefdfc; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #fefdfc; }
    #loading img { width: 96px; height: 96px; border-radius: 18px; }
    @media (prefers-color-scheme: dark) {
      html, body, #loading { background: #0e1726; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-label="FirstCase">
    <picture>
      <source srcset="icons/app-192.png" media="(prefers-color-scheme: dark)">
      <img src="icons/mark-light-192.png" alt="FirstCase" width="96" height="96">
    </picture>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading')?.remove();
    }, { once: true });
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
